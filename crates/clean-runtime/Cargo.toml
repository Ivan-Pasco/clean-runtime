[package]
name = "clean-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Clean runtime binary — dispatches to the host implementing the requested world."

[[bin]]
name = "clean-runtime"
path = "src/main.rs"

[dependencies]
# The hosts implemented today. `clean-worker`, `clean-browser` and `clean-edge`
# join this list as their repos land; the dispatch table in `world.rs` is the
# single place that changes.
clean-server = { workspace = true }
clean-cli = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
