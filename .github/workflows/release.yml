name: release

# Publishes `clean-runtime` release assets in the shape `cln install runtime`
# expects: `<binary>-<version>-<os>-<arch>.<ext>` plus a `.sha256` sidecar for
# each, matching cln-shared's `Platform::asset_matches` (tar.gz on Unix, zip on
# Windows).
#
# Manager resolves `runtime` to `Ivan-Pasco/clean-runtime` by default, so these
# assets are what `cln install runtime latest` downloads.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          path: clean-runtime

      # Sibling path dependencies, as in ci.yml. At M1 these become git pins
      # and this block goes away.
      - name: check out clean-server
        uses: actions/checkout@v4
        with:
          repository: Ivan-Pasco/clean-server
          path: clean-server
          ssh-key: ${{ secrets.CLEAN_SERVER_DEPLOY_KEY }}

      - name: check out clean-host-core
        uses: actions/checkout@v4
        with:
          repository: Ivan-Pasco/clean-host-core
          path: clean-host-core
          ssh-key: ${{ secrets.CLEAN_HOST_CORE_DEPLOY_KEY }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clean-runtime
          key: ${{ matrix.target }}

      - name: build
        working-directory: clean-runtime
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # The tag and the version the binary reports must agree — Cloud's node
      # agent probes `--version` to satisfy each package's runtime pin, so a
      # mismatch here silently breaks every deploy that pinned this release.
      - name: verify reported version matches the tag
        working-directory: clean-runtime
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bin="target/${{ matrix.target }}/release/clean-runtime"
          # Cross-built x86_64 binaries do not run on an arm64 runner.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            echo "skipping version probe: cross-built for ${{ matrix.target }}"
            exit 0
          fi
          reported="$("$bin" --version | awk '{print $NF}')"
          if [ "$reported" != "$tag" ]; then
            echo "tag v$tag but binary reports $reported"
            echo "bump the workspace version to match the tag before releasing"
            exit 1
          fi
          echo "clean-runtime $reported matches tag v$tag"

      # Which host versions this runtime bundles is not recoverable from the
      # binary once it is built, and after the repo split the hosts version
      # independently. Record it next to the asset so a deployed runtime can be
      # traced back to the exact hosts inside it.
      - name: record the bundled host versions
        working-directory: clean-runtime
        shell: bash
        run: |
          {
            echo "clean-runtime ${GITHUB_REF_NAME#v}"
            echo "built $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "bundled hosts:"
            printf "  clean-server %s (%s)\n" \
              "$(grep -m1 '^version' ../clean-server/Cargo.toml | cut -d'"' -f2)" \
              "$(git -C ../clean-server rev-parse --short HEAD)"
            echo ""
            echo "clean-host-core $(grep -m1 '^version' ../clean-host-core/Cargo.toml | cut -d'"' -f2) ($(git -C ../clean-host-core rev-parse --short HEAD))"
          } > BUNDLED-HOSTS.txt
          cat BUNDLED-HOSTS.txt

      - name: package
        working-directory: clean-runtime
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/clean-runtime" "$staging/"
          cp BUNDLED-HOSTS.txt "$staging/"
          # Each bundled host's contract travels with the binary: HCV-02 makes
          # host.wit the host's declaration artifact, and Manager caches it
          # under ~/.cln/host-wit/. One file per host, named for the host.
          cp ../clean-server/host.wit "$staging/clean-server.host.wit"

          mkdir -p dist
          asset="clean-runtime-${version}-${{ matrix.platform }}.${{ matrix.ext }}"
          tar -czf "dist/${asset}" -C "$staging" .
          # Sidecar checksum, bare-hash format so `sha256sum -c` works after a
          # rename and `cut -d' ' -f1` works everywhere.
          if command -v sha256sum >/dev/null; then
            sha256sum "dist/${asset}" | cut -d' ' -f1 > "dist/${asset}.sha256"
          else
            shasum -a 256 "dist/${asset}" | cut -d' ' -f1 > "dist/${asset}.sha256"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: clean-runtime/dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -la dist/

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
